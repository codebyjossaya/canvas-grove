events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream canvas_app {
    zone canvas_app 64k;
    server app:3000 resolve;
  }

  upstream browser_host {
    zone browser_host 64k;
    server browser-orchestrator:8080 resolve;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_host $forwarded_port {
    ~^(?:desktop-lnvmg14|canvas-grove)\.tail8dc4e4\.ts\.net(?::443)?$ 443;
    ~:(?<incoming_port>[0-9]+)$ $incoming_port;
    default $server_port;
  }

  # Tailscale Serve terminates trusted HTTPS on the host before forwarding to
  # this gateway. Match only this node's exact MagicDNS authority so arbitrary
  # LAN clients cannot spoof X-Forwarded-Proto.
  map $http_host $forwarded_proto {
    ~^(?:desktop-lnvmg14|canvas-grove)\.tail8dc4e4\.ts\.net(?::443)?$ https;
    default $scheme;
  }

  server {
    listen 8080;
    server_tokens off;

    # Control and diagnostic endpoints are intentionally never published.
    location ^~ /v1/ { return 404; }
    location = /health { return 404; }

    location ^~ /live/ {
      proxy_pass http://browser_host;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $forwarded_port;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }

    location ^~ /viewer/ {
      proxy_pass http://browser_host;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $forwarded_port;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://canvas_app;
      proxy_http_version 1.1;
      # Next dev hot reload (/_next/webpack-hmr) is a websocket.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $forwarded_port;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
