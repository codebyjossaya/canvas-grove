<!doctype html>
<meta charset="utf-8">
<title>Grove for Canvas</title>
<style>
  body{font:14px system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;color:#222}
  label{display:block;margin:1rem 0 .25rem;font-weight:600}
  input{width:100%;padding:.5rem;box-sizing:border-box;font:inherit}
  button{margin-top:1rem;padding:.5rem 1rem;font:inherit}
  #status{margin-top:1rem;min-height:1.5rem} small{color:#666}
  @media (prefers-color-scheme:dark){body{background:#161616;color:#eee}input{background:#222;color:#eee;border:1px solid #444}small{color:#aaa}}
</style>
<h1>Grove for Canvas</h1>
<p>Links from Grove to Canvas open in a new tab with your Canvas session already in this browser. Without the extension they are ordinary links.</p>
<label for="grove">Grove address</label>
<input id="grove" placeholder="https://your-grove.example" autocomplete="off">
<label for="canvas">Canvas address</label>
<input id="canvas" placeholder="https://ufl.instructure.com" autocomplete="off">
<small>Only these two sites get access. Shift-click a Canvas link in Grove to replace this browser's Canvas session with Grove's.</small>
<br><button id="save">Save and allow access</button>
<div id="status" role="status"></div>
<script src="options.js" type="module"></script>
